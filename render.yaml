services:
  - type: web
    name: cuota-clara
    branch: cuota-clara-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: DEMO_MODE
        value: 'true'
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
